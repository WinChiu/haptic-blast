version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # TileServer GL: Serves vector/raster map tiles
  # ---------------------------------------------------------------------------
  tileserver:
    image: maptiler/tileserver-gl
    container_name: map-tileserver
    restart: always
    volumes:
      - ./data/tiles.mbtiles:/data/tiles.mbtiles
    command: -p 8080 -c /data/config.json
    depends_on:
      - init-data # Ensure data exists before starting (see setup.sh)

  # ---------------------------------------------------------------------------
  # GraphHopper: High-performance routing engine
  # ---------------------------------------------------------------------------
  graphhopper:
    image: israelhikingmap/graphhopper:latest
    container_name: map-router
    restart: always
    volumes:
      - ./data:/data
    environment:
      - JAVA_OPTS=-Xmx4g -Xms1g
    command:
      - --input
      - /data/stockholm.osm.pbf
      - --config
      - /data/config-example.yml

  # ---------------------------------------------------------------------------
  # Nginx Proxy: Unified endpoint for app
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: map-proxy
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - tileserver
      - graphhopper

  # Helper service to ensure data directory exists with correct permissions
  init-data:
    image: busybox
    command: sh -c "mkdir -p /data && chown -R 1000:1000 /data"
    volumes:
      - ./data:/data
